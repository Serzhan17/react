<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#4f46e5" />
  <title>Offline · Task Tracker</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f5f6fa; color: #1c2030; line-height: 1.5; }
    main { max-width: 440px; text-align: center; background: #fff; border: 1px solid #e3e6ee; border-radius: 16px; padding: 32px 20px; }
    .icon { font-size: 3rem; }
    h1 { margin: 8px 0; font-size: 1.5rem; }
    p { color: #6b7280; }
    button { font: inherit; min-height: 44px; padding: 8px 18px; border-radius: 8px; border: 0; background: #4f46e5; color: #fff; cursor: pointer; }
    #msg { min-height: 1.5em; font-size: 0.9rem; }
    @media (prefers-color-scheme: dark) {
      body { background: #14161f; color: #e8eaf2; }
      main { background: #1e2130; border-color: #2e3248; }
      p { color: #9aa1b5; }
    }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">📡</div>
    <h1>You're offline</h1>
    <p>The page you asked for could not be loaded and is not saved on this device yet. Pages and data you opened before stay available once the app is open.</p>
    <button id="retry" type="button">Retry connection</button>
    <p id="msg" role="status"></p>
  </main>
  <script>
    document.getElementById("retry").addEventListener("click", function () {
      var msg = document.getElementById("msg");
      msg.textContent = "Checking…";
      fetch("/ping.txt?__ping=" + Date.now(), { cache: "no-store" })
        .then(function (r) { return r.text(); })
        .then(function (t) {
          if (t.trim() === "ok") { location.href = "/"; } else { msg.textContent = "Still offline."; }
        })
        .catch(function () { msg.textContent = "Still offline. Check your connection and try again."; });
    });
  </script>
</body>
</html>
